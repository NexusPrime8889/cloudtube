
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudTube</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0e17;color:white;
font-family:Arial,sans-serif}
header{height:70px;padding:15px 5%;
display:flex;align-items:center;justify-content:space-between;
background:#121827;position:sticky;top:0}
.logo{font-size:25px;font-weight:bold;color:#ff5353}
.search{background:#202a3b;border:1px solid #34415a;
border-radius:25px;padding:12px;color:white;width:35%}
button{background:#ff4545;color:white;border:0;
padding:12px 18px;border-radius:10px;cursor:pointer}
nav{padding:20px 5%;display:flex;gap:10px;flex-wrap:wrap}
nav button{background:#202a3b}
nav button.active{background:#ff4545}
main{padding:10px 5%}
h2{margin-top:10px}
.videos{display:grid;grid-template-columns:
repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{background:#151d2c;border-radius:14px;
overflow:hidden;cursor:pointer}
.thumb{height:145px;background:linear-gradient(135deg,#174b89,#7c3aed);
display:flex;align-items:center;justify-content:center;
font-size:35px}
.card video{width:100%;height:145px;object-fit:cover}
.info{padding:13px}
.info p{color:#aab5c7;font-size:13px}
#file{display:none}
.empty{color:#aab5c7;padding:20px}
</style>
</head>
<body>

<header>
<div class="logo">▶ CloudTube</div>
<input class="search" id="search"
placeholder="Buscar videos..." oninput="render()">
<button onclick="document.getElementById('file').click()">
+ Subir video
</button>
<input id="file" type="file" accept="video/*">
</header>

<nav id="categories">
<button class="active" onclick="category('Todos',this)">Todos</button>
<button onclick="category('Gaming',this)">Gaming</button>
<button onclick="category('Música',this)">Música</button>
<button onclick="category('Tecnología',this)">Tecnología</button>
</nav>

<main>
<h2>Descubre videos</h2>
<div class="videos" id="videos"></div>
</main>

<script>
let videos=[
 {name:"Bienvenido a CloudTube",channel:"CloudTube",
 category:"Tecnología",symbol:"▶"},
 {name:"Roblox Gaming",channel:"Gaming World",
 category:"Gaming",symbol:"🎮"},
 {name:"Minecraft Adventures",channel:"Block World",
 category:"Gaming",symbol:"⛏️"},
 {name:"Tecnología del futuro",channel:"Tech Channel",
 category:"Tecnología",symbol:"💻"}
];

let selected="Todos";

function category(name,button){
 selected=name;
 document.querySelectorAll("nav button")
 .forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 render();
}

function render(){
 const search=document.getElementById("search")
 .value.toLowerCase();
 const list=document.getElementById("videos");
 list.innerHTML="";

 let filtered=videos.filter(v=>
 (selected==="Todos"||v.category===selected)&&
 v.name.toLowerCase().includes(search)
 );

 if(!filtered.length){
 list.innerHTML='<p class="empty">No hay videos encontrados.</p>';
 return;
 }

 filtered.forEach(v=>{
 const card=document.createElement("div");
 card.className="card";

 if(v.url){
 const player=document.createElement("video");
 player.src=v.url;
 player.controls=true;
 player.preload="metadata";
 card.appendChild(player);
 }else{
 const thumb=document.createElement("div");
 thumb.className="thumb";
 thumb.textContent=v.symbol;
 card.appendChild(thumb);
 }

 const info=document.createElement("div");
 info.className="info";
 const title=document.createElement("strong");
 title.textContent=v.name;
 const channel=document.createElement("p");
 channel.textContent=v.channel;
 info.append(title,channel);
 card.appendChild(info);
 list.appendChild(card);
 });
}

document.getElementById("file").onchange=e=>{
 const file=e.target.files[0];
 if(!file)return;

 if(!file.type.startsWith("video/")){
 alert("Selecciona un archivo de video.");
 return;
 }

 const url=URL.createObjectURL(file);
 videos.unshift({
 name:file.name,
 channel:"Mi canal",
 category:"Todos",
 url:url
 });

 selected="Todos";
 document.querySelectorAll("nav button")
 .forEach(b=>b.classList.remove("active"));
 document.querySelector("nav button").classList.add("active");
 render();
 e.target.value="";
};

render();
</script>
</body>
</html>
